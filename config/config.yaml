# ─────────────────────────────────────────────────────────────────────────────
# Master control panel for a single experiment batch.
# ─────────────────────────────────────────────────────────────────────────────
run_name: gen_jobs_test
description: "Baseline HPS1 test for the pipeline generating batch jobs from a csv dataset of sequences."
# ── Sequence selection ────────────────────────────────────────────────────────
sequences:
  source: protein_dataset.csv

  name_column: ID
  sequence_column: Sequence
  range: [1,100]
# ── Parameter sets ────────────────────────────────────────────────────────────
num_replicates: 1
param_sets: [baseline]   # Example: ["baseline", "cold"] for 2 replicates per sequence
delete_trajectories_after_analysis: false
# ── Execution ─────────────────────────────────────────────────────────────────
runner: slurm                 # local | slurm — only changes which "Next:" command generate_jobs.py prints

# Named physics parameter sets. A set with `extends: <other>` inherits every field of
# <other> and only lists what it changes.
baseline:
  description: "Standard HPS conditions, room temperature"

  # Thermodynamics
  temperature_K: 298
  ionic_concentration_M: 0.150        # salt concentration in mol/L

  # Force field
  hydropathy_scale: HPS1
  epsilon_lj: 0.1                     # kCal/mol, LJ well depth
  yukawa_r_cut: 3.5                   # nm, cutoff for electrostatics
  lj_r_cut: 3.5                       # nm, cutoff for attractive LJ

  # Bonded
  harmonic_k: 1920                    # kCal/mol/nm^2
  harmonic_r0: 0.38                   # nm, equilibrium bond length

  # Box
  box_size: 500                       # nm

  # Integrator
  dt: 0.01                            # timestep (dimensionless HPS units)

  # Run length, as multiples of N^2.2 time units (N = chain length):
  #   steps = int(multiplier * N^2.2 / dt)
  # Measured on the benchmark set at 298 K, the slowest chain relaxation takes at most
  # ~0.08 of one such unit, so 2 is >25 relaxation times of equilibration and 20 gives
  # roughly 1800 independent Rg samples (mean Rg to ~0.5%) per replicate.
  rouse_multiplier: 2                 # equilibration length
  production_multiplier: 22           # production length
  # Leave empty to use the multipliers above; an integer is a fixed step count override
  equilibration_steps:
  production_steps:

  # Output: number of evenly spaced frames saved over the production run (one every
  # production_steps / frames steps), the same for every chain length
  frames: 3000
cold:
  extends: baseline
  description: "Very low temperature run for collapse behavior"
  temperature_K: 5
dummy:
  extends: baseline
  description: "Tiny fixed-length run for smoke-testing the pipeline structure (not physical)"
  equilibration_steps: 1000
  production_steps: 10000
  frames: 50
